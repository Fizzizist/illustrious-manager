[package]
name = "illustrious-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.32"
gcp_auth = "0.12.6"
ignore = "0.4.25"
jsonschema = "0.46.0"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
pin-project-lite = "0.2.17"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.0"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustls = "0.23.37"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "3.1.0"
syntect = { version = "5.3.0", features = ["default-syntaxes", "default-themes", "regex-fancy"] }
syntect-assets = "0.23.6"
tokenizers = "0.22.2"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.1.0"
tree-sitter = "0.26.8"
tree-sitter-c = { version = "0.24.1", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tui-markdown = "0.3.7"
turso = "0.5.3"
unicode-width = "0.2.2"
ureq = "3.3.0"
uuid = { version = "1.23.0", features = ["v7"] }

[dev-dependencies]
insta = "1.47.0"
tempfile = "3.27.0"

[features]
default = ["ts-rust"]
ts-rust = ["dep:tree-sitter-rust"]
ts-typescript = ["dep:tree-sitter-typescript"]
ts-python = ["dep:tree-sitter-python"]
ts-go = ["dep:tree-sitter-go"]
ts-java = ["dep:tree-sitter-java"]
ts-c = ["dep:tree-sitter-c"]
ts-cpp = ["dep:tree-sitter-cpp"]
ts-all = ["ts-rust", "ts-typescript", "ts-python", "ts-go", "ts-java", "ts-c", "ts-cpp"]
