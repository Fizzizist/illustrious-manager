[package]
name = "illustrious-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.32"
gcp_auth = "0.12.6"
jsonschema = "0.46.0"
pin-project-lite = "0.2.17"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.0"
reqwest = { version = "0.13.2", features = ["blocking", "json", "stream"] }
rustls = "0.23.37"
search-semantically = "0.1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "3.1.0"
syntect = { version = "5.3.0", features = ["default-syntaxes", "default-themes", "regex-fancy"] }
syntect-assets = "0.23.6"
the-other-tui-markdown = "0.1.0"
time = { version = "0.3.47", features = ["local-offset", "formatting"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.0"
turso = "0.5.3"
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"
uuid = { version = "1.23.0", features = ["v7"] }

[dev-dependencies]
insta = "1.47.0"
tempfile = "3.27.0"

