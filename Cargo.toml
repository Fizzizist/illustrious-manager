[package]
name = "illustrious-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
gcp_auth = "0.12"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
futures = "0.3"
dirs = "6"
anyhow = "1"
async-trait = "0.1"
pin-project-lite = "0.2"

[dev-dependencies]
tempfile = "3"
insta = "1"
