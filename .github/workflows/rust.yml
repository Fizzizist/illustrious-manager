name: Rust

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install ONNX Runtime
      run: |
        curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz \
          | tar xz -C "$HOME"
        echo "ORT_DYLIB_PATH=$HOME/onnxruntime-linux-x64-1.28.0/lib/libonnxruntime.so" >> "$GITHUB_ENV"
    - name: Pre-download embedding model
      run: |
        model_dir="$HOME/.cache/search-semantically/models/Xenova/all-MiniLM-L6-v2"
        mkdir -p "$model_dir"
        curl -sSL -o "$model_dir/model.onnx" \
          https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
        curl -sSL -o "$model_dir/tokenizer.json" \
          https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/tokenizer.json
    - name: Format
      run: cargo fmt --check
    - name: Run clippy
      run: cargo clippy -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
